name: Export complete source

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          zip -r pc-builder-hub-completo.zip . \
            -x '.git/*' \
            -x 'node_modules/*' \
            -x '.next/*'

      - name: Upload complete project
        uses: actions/upload-artifact@v4
        with:
          name: pc-builder-hub-completo
          path: pc-builder-hub-completo.zip
          if-no-files-found: error
          retention-days: 1
